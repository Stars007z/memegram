apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: memegram
  labels:
    app: auth-service
    app.kubernetes.io/part-of: memegram
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
        app.kubernetes.io/part-of: memegram
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - "until nc -z auth-postgres 5432; do echo waiting for postgres; sleep 2; done"
      containers:
        - name: auth-service
          image: memegram/auth-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 50051
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: "postgresql+asyncpg://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@auth-postgres:5432/auth_db"
            - name: DB_HOST
              value: auth-postgres
            - name: DB_PORT
              value: "5432"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: POSTGRES_USER
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: JWT_SECRET
            - name: JWT_ALGORITHM
              value: HS256
            - name: GRPC_PORT
              value: "50051"
            - name: REDIS_URL
              value: "redis://auth-redis:6379/0"
          readinessProbe:
            exec:
              command:
                - python
                - -c
                - "import grpc; channel = grpc.insecure_channel('localhost:50051'); grpc.channel_ready_future(channel).result(timeout=5)"
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: memegram
  labels:
    app: auth-service
    app.kubernetes.io/part-of: memegram
spec:
  type: ClusterIP
  selector:
    app: auth-service
  ports:
    - port: 50051
      targetPort: 50051
