version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    container_name: contacts-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - contacts-network

  contacts-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: contacts-service
    command: >
      sh -c "
        echo 'Waiting for database...' &&
        until pg_isready -h postgres -U ${POSTGRES_USER} -d ${POSTGRES_DB}; do sleep 1; done &&
        echo 'Applying migrations...' &&
        alembic upgrade head &&
        echo 'Starting gRPC server...' &&
        python -m app.main
      "
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - GRPC_PORT=${GRPC_PORT:-50053}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - SERVICE_VERSION=${SERVICE_VERSION:-1.0.0}
      - USER_GRPC_HOST=user-service
      - USER_GRPC_PORT=50052
      - USER_GRPC_TIMEOUT=5.0
    ports:
      - "50053:50053"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - contacts-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
        "import grpc; ch = grpc.insecure_channel('localhost:50053'); grpc.channel_ready_future(ch).result(timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

networks:
  contacts-network:
    driver: bridge

volumes:
  postgres_data:
