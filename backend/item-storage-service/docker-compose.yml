version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    container_name: item-storage-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5437:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - item-storage-network

  minio:
    image: minio/minio:latest
    container_name: item-storage-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - item-storage-network

  minio-init:
    image: minio/mc:latest
    container_name: item-storage-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing local/messenger-items-dev &&
        echo 'Bucket created'
      "
    networks:
      - item-storage-network

  item-storage-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: item-storage-service
    command: >
      sh -c "
        echo 'Waiting for database...' &&
        until pg_isready -h postgres -U ${POSTGRES_USER} -d ${POSTGRES_DB}; do sleep 1; done &&
        echo 'Applying migrations...' &&
        alembic upgrade head &&
        echo 'Starting gRPC server...' &&
        python -m app.main
      "
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - GRPC_PORT=${GRPC_PORT:-50056}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - SERVICE_VERSION=${SERVICE_VERSION:-1.0.0}
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - AWS_REGION=eu-central-1
      - S3_BUCKET_NAME=messenger-items-dev
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_SSE_TYPE=AES256
      - KMS_KEY_ID=
      - PRESIGNED_UPLOAD_TTL=${PRESIGNED_UPLOAD_TTL:-3600}
      - PRESIGNED_DOWNLOAD_TTL=${PRESIGNED_DOWNLOAD_TTL:-900}
      - PENDING_CLEANUP_AFTER_SECONDS=${PENDING_CLEANUP_AFTER_SECONDS:-7200}
    ports:
      - "50056:50056"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - item-storage-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
        "import grpc; ch = grpc.insecure_channel('localhost:50056'); grpc.channel_ready_future(ch).result(timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

networks:
  item-storage-network:
    driver: bridge

volumes:
  postgres_data:
  minio_data:
