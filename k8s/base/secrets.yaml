apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  namespace: memegram
type: Opaque
stringData:
  # Postgres credentials (shared across all DB instances for dev)
  POSTGRES_USER: memegram
  POSTGRES_PASSWORD: changeme

  # JWT
  JWT_SECRET: dev_secret_change_in_prod
  JWT_ALGORITHM: HS256
---
apiVersion: v1
kind: Secret
metadata:
  name: aws-credentials
  namespace: memegram
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: ""
  AWS_SECRET_ACCESS_KEY: ""
  AWS_REGION: eu-central-1
---
apiVersion: v1
kind: Secret
metadata:
  name: firebase-credentials
  namespace: memegram
type: Opaque
stringData:
  FCM_PROJECT_ID: ""
  # In production, mount the JSON key file via a volume
  GOOGLE_APPLICATION_CREDENTIALS: ""
