version: '3.9'

services:
  orchestrator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: memegram-orchestrator
    ports:
      - "8000:8000"
    environment:
      - APP_TITLE=Memegram Orchestrator
      - APP_VERSION=1.0.0
      - DEBUG=false
      - AUTH_GRPC_HOST=auth-service
      - AUTH_GRPC_PORT=50051
      - AUTH_GRPC_TIMEOUT=10.0
      - USER_GRPC_HOST=user-service
      - USER_GRPC_PORT=50052
      - USER_GRPC_TIMEOUT=10.0
      - CONTACTS_GRPC_HOST=contacts-service
      - CONTACTS_GRPC_PORT=50053
      - CONTACTS_GRPC_TIMEOUT=10.0
      - MESSAGING_GRPC_HOST=messaging-service
      - MESSAGING_GRPC_PORT=50054
      - MESSAGING_GRPC_TIMEOUT=10.0
      - MEDIA_GRPC_HOST=media-service
      - MEDIA_GRPC_PORT=50055
      - MEDIA_GRPC_TIMEOUT=10.0
      - AUTO_DELETE_CRON_HOUR=3
      - AUTO_DELETE_CRON_MINUTE=0
    depends_on:
      auth-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
      contacts-service:
        condition: service_healthy
      messaging-service:
        condition: service_healthy
      media-service:
        condition: service_healthy
    networks:
      - memegram-backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
        "import httpx; exit(0 if httpx.get('http://localhost:8000/health').status_code == 200 else 1)"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  memegram-backend:
    external: true
