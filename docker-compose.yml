version: '3.9'

services:

  # ─────────────────────────────────────────
  # AUTH
  # ─────────────────────────────────────────

  auth-postgres:
    image: postgres:15-alpine
    container_name: memegram-auth-postgres
    environment:
      POSTGRES_USER: ${AUTH_DB_USER:-memegram}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:-changeme}
      POSTGRES_DB: ${AUTH_DB_NAME:-auth_db}
    ports:
      - "5432:5432"
    volumes:
      - auth_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AUTH_DB_USER:-memegram} -d ${AUTH_DB_NAME:-auth_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - memegram-backend
    restart: unless-stopped

  auth-redis:
    image: redis:7-alpine
    container_name: memegram-auth-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3
    networks:
      - memegram-backend
    restart: unless-stopped

  auth-service:
    build:
      context: ./backend/auth-service
      dockerfile: Dockerfile
    container_name: memegram-auth-service
    command: >
      sh -c "
        echo 'Waiting for postgres...' &&
        until pg_isready -h auth-postgres -U ${AUTH_DB_USER:-memegram} -d ${AUTH_DB_NAME:-auth_db}; do sleep 1; done &&
        echo 'Running migrations...' &&
        alembic upgrade head &&
        echo 'Starting gRPC server...' &&
        python -m app.main
      "
    environment:
      - DATABASE_URL=postgresql+asyncpg://${AUTH_DB_USER:-memegram}:${AUTH_DB_PASSWORD:-changeme}@auth-postgres:5432/${AUTH_DB_NAME:-auth_db}
      - JWT_SECRET=${JWT_SECRET:-dev_secret_change_in_prod}
      - JWT_ALGORITHM=HS256
      - GRPC_PORT=50051
      - REDIS_URL=redis://auth-redis:6379/0
    ports:
      - "50051:50051"
    depends_on:
      auth-postgres:
        condition: service_healthy
      auth-redis:
        condition: service_healthy
    networks:
      - memegram-backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import grpc; channel = grpc.insecure_channel('localhost:50051'); grpc.channel_ready_future(channel).result(timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ─────────────────────────────────────────
  # USER
  # ─────────────────────────────────────────

  user-postgres:
    image: postgres:15-alpine
    container_name: memegram-user-postgres
    environment:
      POSTGRES_USER: ${USER_DB_USER:-memegram}
      POSTGRES_PASSWORD: ${USER_DB_PASSWORD:-changeme}
      POSTGRES_DB: ${USER_DB_NAME:-user_db}
    ports:
      - "5433:5432"
    volumes:
      - user_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${USER_DB_USER:-memegram} -d ${USER_DB_NAME:-user_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - memegram-backend
    restart: unless-stopped

  user-redis:
    image: redis:7-alpine
    container_name: memegram-user-redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3
    networks:
      - memegram-backend
    restart: unless-stopped

  user-service:
    build:
      context: ./backend/user-service
      dockerfile: Dockerfile
    container_name: memegram-user-service
    command: >
      sh -c "
        echo 'Waiting for postgres...' &&
        until pg_isready -h user-postgres -U ${USER_DB_USER:-memegram} -d ${USER_DB_NAME:-user_db}; do sleep 1; done &&
        echo 'Running migrations...' &&
        alembic upgrade head &&
        echo 'Starting gRPC server...' &&
        python -m app.main
      "
    environment:
      - DATABASE_URL=postgresql+asyncpg://${USER_DB_USER:-memegram}:${USER_DB_PASSWORD:-changeme}@user-postgres:5432/${USER_DB_NAME:-user_db}
      - GRPC_PORT=50052
      - REDIS_URL=redis://user-redis:6379/0
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - SERVICE_VERSION=${SERVICE_VERSION:-1.0.0}
    ports:
      - "50052:50052"
    depends_on:
      user-postgres:
        condition: service_healthy
      user-redis:
        condition: service_healthy
    networks:
      - memegram-backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import grpc; channel = grpc.insecure_channel('localhost:50052'); grpc.channel_ready_future(channel).result(timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ─────────────────────────────────────────
  # CONTACTS
  # ─────────────────────────────────────────

  contacts-postgres:
    image: postgres:15-alpine
    container_name: memegram-contacts-postgres
    environment:
      POSTGRES_USER: ${CONTACTS_DB_USER:-memegram}
      POSTGRES_PASSWORD: ${CONTACTS_DB_PASSWORD:-changeme}
      POSTGRES_DB: ${CONTACTS_DB_NAME:-contacts_db}
    ports:
      - "5434:5432"
    volumes:
      - contacts_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CONTACTS_DB_USER:-memegram} -d ${CONTACTS_DB_NAME:-contacts_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - memegram-backend
    restart: unless-stopped

  contacts-service:
    build:
      context: ./backend/contacts-service
      dockerfile: Dockerfile
    container_name: memegram-contacts-service
    command: >
      sh -c "
        echo 'Waiting for postgres...' &&
        until pg_isready -h contacts-postgres -U ${CONTACTS_DB_USER:-memegram} -d ${CONTACTS_DB_NAME:-contacts_db}; do sleep 1; done &&
        echo 'Running migrations...' &&
        alembic upgrade head &&
        echo 'Starting gRPC server...' &&
        python -m app.main
      "
    environment:
      - DATABASE_URL=postgresql+asyncpg://${CONTACTS_DB_USER:-memegram}:${CONTACTS_DB_PASSWORD:-changeme}@contacts-postgres:5432/${CONTACTS_DB_NAME:-contacts_db}
      - GRPC_PORT=50053
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - SERVICE_VERSION=${SERVICE_VERSION:-1.0.0}
      - USER_GRPC_HOST=user-service
      - USER_GRPC_PORT=50052
      - USER_GRPC_TIMEOUT=5.0
    ports:
      - "50053:50053"
    depends_on:
      contacts-postgres:
        condition: service_healthy
      user-service:
        condition: service_healthy
    networks:
      - memegram-backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import grpc; channel = grpc.insecure_channel('localhost:50053'); grpc.channel_ready_future(channel).result(timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ─────────────────────────────────────────
  # ORCHESTRATOR
  # ─────────────────────────────────────────

  orchestrator:
    build:
      context: ./backend/orchestrator
      dockerfile: Dockerfile
    container_name: memegram-orchestrator
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--loop", "uvloop"]
    environment:
      - APP_NAME=Memegram Orchestrator
      - APP_VERSION=1.0.0
      - HOST=0.0.0.0
      - PORT=8000
      - LOG_LEVEL=INFO
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - AUTH_GRPC_HOST=auth-service
      - AUTH_GRPC_PORT=50051
      - AUTH_GRPC_TIMEOUT=30
      - USER_GRPC_HOST=user-service
      - USER_GRPC_PORT=50052
      - USER_GRPC_TIMEOUT=30
      - CONTACTS_GRPC_HOST=contacts-service
      - CONTACTS_GRPC_PORT=50053
      - CONTACTS_GRPC_TIMEOUT=10
      - CORS_ORIGINS=["http://localhost:3000","http://127.0.0.1:3000"]
      - REDIS_URL=redis://auth-redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      auth-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
      contacts-service:
        condition: service_healthy
    networks:
      - memegram-backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; exit(0 if httpx.get('http://localhost:8000/health').status_code == 200 else 1)"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s


networks:
  memegram-backend:
    driver: bridge

volumes:
  auth_postgres_data:
  user_postgres_data:
  contacts_postgres_data: