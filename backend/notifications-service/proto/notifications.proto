syntax = "proto3";
package notifications;

// ──────────────────────────────────────────────
// Notifications Service
// ──────────────────────────────────────────────

service NotificationsService {
    rpc RegisterPushToken(RegisterPushTokenRequest)     returns (RegisterPushTokenResponse);
    rpc UnregisterPushToken(UnregisterPushTokenRequest) returns (UnregisterPushTokenResponse);
    rpc HealthCheck(HealthCheckRequest)                 returns (HealthCheckResponse);
}

// ── RegisterPushToken ──────────────────────────

message RegisterPushTokenRequest {
    string user_id    = 1;
    string device_id  = 2;
    string platform   = 3; // ios / android
    string push_token = 4;
}

message RegisterPushTokenResponse {
    bool success = 1;
}

// ── UnregisterPushToken ────────────────────────

message UnregisterPushTokenRequest {
    string user_id   = 1;
    string device_id = 2;
}

message UnregisterPushTokenResponse {
    bool success = 1;
}

// ── HealthCheck ────────────────────────────────

message HealthCheckRequest {}

message HealthCheckResponse {
    string status       = 1; // ok / degraded
    string db_status    = 2;
    string redis_status = 3;
    string fcm_status   = 4;
    string apns_status  = 5;
    string version      = 6;
}
