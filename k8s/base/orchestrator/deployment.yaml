apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator
  namespace: memegram
  labels:
    app: orchestrator
    app.kubernetes.io/part-of: memegram
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orchestrator
  template:
    metadata:
      labels:
        app: orchestrator
        app.kubernetes.io/part-of: memegram
    spec:
      containers:
        - name: orchestrator
          image: memegram/orchestrator:latest
          imagePullPolicy: IfNotPresent
          command:
            - uvicorn
            - app.main:app
            - --host
            - "0.0.0.0"
            - --port
            - "8000"
            - --loop
            - uvloop
          ports:
            - containerPort: 8000
          env:
            - name: APP_NAME
              value: "Memegram Orchestrator"
            - name: APP_VERSION
              value: "1.0.0"
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "8000"
            - name: LOG_LEVEL
              value: INFO
            - name: ENVIRONMENT
              value: development
            - name: AUTH_GRPC_HOST
              value: auth-service
            - name: AUTH_GRPC_PORT
              value: "50051"
            - name: AUTH_GRPC_TIMEOUT
              value: "30"
            - name: USER_GRPC_HOST
              value: user-service
            - name: USER_GRPC_PORT
              value: "50052"
            - name: USER_GRPC_TIMEOUT
              value: "30"
            - name: CONTACTS_GRPC_HOST
              value: contacts-service
            - name: CONTACTS_GRPC_PORT
              value: "50053"
            - name: CONTACTS_GRPC_TIMEOUT
              value: "10"
            - name: MESSAGING_GRPC_HOST
              value: messaging-service
            - name: MESSAGING_GRPC_PORT
              value: "50054"
            - name: MESSAGING_GRPC_TIMEOUT
              value: "30"
            - name: MEDIA_GRPC_HOST
              value: media-service
            - name: MEDIA_GRPC_PORT
              value: "50055"
            - name: MEDIA_GRPC_TIMEOUT
              value: "10"
            - name: ITEM_STORAGE_GRPC_HOST
              value: item-storage-service
            - name: ITEM_STORAGE_GRPC_PORT
              value: "50056"
            - name: ITEM_STORAGE_GRPC_TIMEOUT
              value: "10"
            - name: NOTIFICATIONS_GRPC_HOST
              value: notifications-service
            - name: NOTIFICATIONS_GRPC_PORT
              value: "50057"
            - name: NOTIFICATIONS_GRPC_TIMEOUT
              value: "10"
            - name: CORS_ORIGINS
              value: '["http://localhost:3000","http://127.0.0.1:3000"]'
            - name: REDIS_URL
              value: "redis://auth-redis:6379/0"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: orchestrator
  namespace: memegram
  labels:
    app: orchestrator
    app.kubernetes.io/part-of: memegram
spec:
  type: NodePort
  selector:
    app: orchestrator
  ports:
    - port: 8000
      targetPort: 8000
