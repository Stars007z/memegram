  # minio-init:
  #   image: minio/mc:latest
  #   container_name: memegram-minio-init
  #   depends_on:
  #     minio:
  #       condition: service_healthy
  #   entrypoint: >
  #     /bin/sh -c "
  #       mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-minioadmin} $${MINIO_ROOT_PASSWORD:-minioadmin} &&
  #       mc mb --ignore-existing local/$${S3_BUCKET_NAME:-messenger-media-dev} &&
  #       mc mb --ignore-existing local/$${ITEM_STORAGE_S3_BUCKET:-messenger-items-dev} &&
  #       echo 'Buckets created successfully' &&
  #       exit 0
  #     "
  #   environment:
  #     MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
  #     MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
  #     S3_BUCKET_NAME: ${S3_BUCKET_NAME:-messenger-media-dev}
  #     ITEM_STORAGE_S3_BUCKET: ${ITEM_STORAGE_S3_BUCKET:-messenger-items-dev}
  #   networks:
  #     - memegram-backend

  media-postgres:
    image: postgres:15-alpine
    container_name: memegram-media-postgres
    environment:
      POSTGRES_USER: ${MEDIA_DB_USER:-memegram}
      POSTGRES_PASSWORD: ${MEDIA_DB_PASSWORD:-changeme}
      POSTGRES_DB: ${MEDIA_DB_NAME:-media_db}
    ports:
      - "5436:5432"
    volumes:
      - media_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MEDIA_DB_USER:-memegram} -d ${MEDIA_DB_NAME:-media_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - memegram-backend
    restart: unless-stopped

  media-service:
    build:
      context: ./backend/media-service
      dockerfile: Dockerfile
    container_name: memegram-media-service
    command: >
      sh -c "
        echo 'Waiting for postgres...' &&
        until pg_isready -h media-postgres -U ${MEDIA_DB_USER:-memegram} -d ${MEDIA_DB_NAME:-media_db}; do sleep 1; done &&
        echo 'Running migrations...' &&
        alembic upgrade head &&
        echo 'Starting gRPC server...' &&
        python -m app.main
