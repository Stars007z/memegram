apiVersion: apps/v1
kind: Deployment
metadata:
  name: media-service
  namespace: memegram
  labels:
    app: media-service
    app.kubernetes.io/part-of: memegram
spec:
  replicas: 1
  selector:
    matchLabels:
      app: media-service
  template:
    metadata:
      labels:
        app: media-service
        app.kubernetes.io/part-of: memegram
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z media-postgres 5432; do echo waiting for postgres; sleep 2; done
      containers:
        - name: media-service
          image: memegram/media-service:latest
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - alembic upgrade head && python -m app.main
          ports:
            - containerPort: 50055
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: postgresql+asyncpg://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@media-postgres:5432/media_db
            - name: GRPC_PORT
              value: "50055"
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: aws-credentials
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: aws-credentials
                  key: AWS_SECRET_ACCESS_KEY
            - name: AWS_REGION
              valueFrom:
                secretKeyRef:
                  name: aws-credentials
                  key: AWS_REGION
            - name: S3_BUCKET_NAME
              value: memegram-media
            - name: S3_ENDPOINT_URL
              value: ""
            - name: PRESIGNED_UPLOAD_TTL
              value: "3600"
            - name: PRESIGNED_DOWNLOAD_TTL
              value: "900"
            - name: MAX_UPLOAD_SIZE_BYTES
              value: "104857600"
            - name: ENVIRONMENT
              value: development
            - name: SERVICE_VERSION
              value: "1.0.0"
          readinessProbe:
            tcpSocket:
              port: 50055
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: media-service
  namespace: memegram
  labels:
    app: media-service
    app.kubernetes.io/part-of: memegram
spec:
  type: ClusterIP
  selector:
    app: media-service
  ports:
    - port: 50055
      targetPort: 50055
