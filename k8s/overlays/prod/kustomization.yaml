apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Production overlay for GKE
# Before deploying, set env vars and run:
#   export GCP_PROJECT_ID=your-project-id
#   export GCP_REGION=europe-west1
#   Then use deploy-gke.sh which generates this dynamically,
#   or manually replace PROJECT_ID and REGION below.

resources:
  - ../../base
  # HTTPS + Cloud Armor stack (Ingress, ManagedCertificate, FrontendConfig, BackendConfig)
  - ingress/managed-certificate.yaml
  - ingress/frontend-config.yaml
  - ingress/backend-config.yaml
  - ingress/ingress.yaml

# Override namespace for prod if needed
namespace: memegram

patches:
  # Scale up orchestrator to 2 replicas
  - target:
      kind: Deployment
      name: orchestrator
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2

  # Override orchestrator Service: NodePort + BackendConfig + NEG annotations.
  # External traffic now flows:
  #   Internet -> Cloud Armor -> Google HTTPS LB (Ingress) -> NEG -> pods
  - path: ingress/orchestrator-service-patch.yaml
    target:
      kind: Service
      name: orchestrator

  # Increase Postgres storage to 2Gi for prod (cost-efficient for course project)
  - target:
      kind: StatefulSet
      labelSelector: app.kubernetes.io/part-of=memegram
    patch: |-
      - op: replace
        path: /spec/volumeClaimTemplates/0/spec/resources/requests/storage
        value: 2Gi

  # Increase service memory limits for prod
  - target:
      kind: Deployment
      labelSelector: app.kubernetes.io/part-of=memegram
      annotationSelector: "!skip-prod-scaling"
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 1Gi

  # Change imagePullPolicy to Always for prod (pull from registry)
  - target:
      kind: Deployment
      labelSelector: app.kubernetes.io/part-of=memegram
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always

# Production images from Google Artifact Registry
# Replace REGION and PROJECT_ID with your values, e.g.:
#   REGION = europe-west1
#   PROJECT_ID = memegram-prod-123456
images:
  - name: memegram/auth-service
    newName: europe-west1-docker.pkg.dev/memegram-493617/memegram/auth-service
    newTag: v1.0.0
  - name: memegram/user-service
    newName: europe-west1-docker.pkg.dev/memegram-493617/memegram/user-service
    newTag: v1.0.0
  - name: memegram/contacts-service
    newName: europe-west1-docker.pkg.dev/memegram-493617/memegram/contacts-service
    newTag: v1.0.0
  - name: memegram/messaging-service
    newName: europe-west1-docker.pkg.dev/memegram-493617/memegram/messaging-service
    newTag: v1.0.0
  - name: memegram/media-service
    newName: europe-west1-docker.pkg.dev/memegram-493617/memegram/media-service
    newTag: v1.0.0
  - name: memegram/item-storage-service
    newName: europe-west1-docker.pkg.dev/memegram-493617/memegram/item-storage-service
    newTag: v1.0.0
  - name: memegram/notifications-service
    newName: europe-west1-docker.pkg.dev/memegram-493617/memegram/notifications-service
    newTag: v1.0.0
  - name: memegram/orchestrator
    newName: europe-west1-docker.pkg.dev/memegram-493617/memegram/orchestrator
    newTag: v1.0.0
