apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Production overlay for GKE
resources:
  - ../../base

# Override namespace for prod if needed
namespace: memegram

patches:
  # Scale up orchestrator to 2 replicas
  - target:
      kind: Deployment
      name: orchestrator
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2

  # Change orchestrator service to LoadBalancer for GKE
  - target:
      kind: Service
      name: orchestrator
    patch: |-
      - op: replace
        path: /spec/type
        value: LoadBalancer

  # Increase Postgres storage to 10Gi for prod
  - target:
      kind: StatefulSet
      labelSelector: app.kubernetes.io/part-of=memegram
    patch: |-
      - op: replace
        path: /spec/volumeClaimTemplates/0/spec/resources/requests/storage
        value: 10Gi

  # Increase service memory limits for prod
  - target:
      kind: Deployment
      labelSelector: app.kubernetes.io/part-of=memegram
      annotationSelector: "!skip-prod-scaling"
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 1Gi

# Production-specific images (will use GCR/Artifact Registry)
# Uncomment and update when pushing to Google Artifact Registry:
# images:
#   - name: memegram/auth-service
#     newName: REGION-docker.pkg.dev/PROJECT_ID/memegram/auth-service
#     newTag: v1.0.0
#   - name: memegram/user-service
#     newName: REGION-docker.pkg.dev/PROJECT_ID/memegram/user-service
#     newTag: v1.0.0
#   ... (repeat for all services)
