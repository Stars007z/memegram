apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-redis
  namespace: memegram
  labels:
    app: user-redis
    app.kubernetes.io/part-of: memegram
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-redis
  template:
    metadata:
      labels:
        app: user-redis
        app.kubernetes.io/part-of: memegram
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
          resources:
            requests:
              memory: 64Mi
              cpu: 50m
            limits:
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: user-redis
  namespace: memegram
  labels:
    app: user-redis
    app.kubernetes.io/part-of: memegram
spec:
  type: ClusterIP
  selector:
    app: user-redis
  ports:
    - port: 6379
      targetPort: 6379
