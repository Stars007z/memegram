# Patch the orchestrator Service to:
# - Use NodePort (Ingress LB will route to NodePort directly via NEG)
# - Attach BackendConfig (which references Cloud Armor policy)
# - Name the port so BackendConfig health check can target it
apiVersion: v1
kind: Service
metadata:
  name: orchestrator
  namespace: memegram
  annotations:
    # BackendConfig per port -> "default" matches all ports without explicit mapping
    cloud.google.com/backend-config: '{"default": "memegram-backend-config"}'
    # Use container-native LB via Network Endpoint Groups (faster, healthier)
    cloud.google.com/neg: '{"ingress": true}'
spec:
  type: NodePort
  selector:
    app: orchestrator
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP
