name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Lint (ruff + black + isort)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: |
            requirements-dev.txt

      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.6.9 black==24.10.0 isort==5.13.2

      - name: Ruff
        run: ruff check backend

      - name: Black (check)
        run: black --check backend

      - name: Isort (check)
        run: isort --check-only backend

  test:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-service
          - user-service
          - messaging-service
          - media-service
          - contacts-service
          - notifications-service
          - item-storage-service
          - orchestrator
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: |
            requirements-dev.txt
            backend/${{ matrix.service }}/requirements.txt

      - name: Install dependencies
        working-directory: backend/${{ matrix.service }}
        run: |
          python -m pip install --upgrade pip
          # Не падаем, если какая-то рантайм-зависимость не встанет в CI-окружении
          # (тесты мокают внешние системы и не требуют всех нативных либ).
          pip install -r requirements.txt || true
          pip install -r ../../requirements-dev.txt

      - name: Run tests with coverage
        working-directory: backend/${{ matrix.service }}
        env:
          PYTHONPATH: ${{ github.workspace }}/backend/${{ matrix.service }}
          # Безопасные значения-заглушки для Settings/конфигов
          ENVIRONMENT: test
          JWT_SECRET: test_secret
          JWT_ALGORITHM: HS256
          DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test
          REDIS_URL: redis://localhost:6379/0
          S3_BUCKET_NAME: test-bucket
          S3_ENDPOINT_URL: http://localhost:9000
          S3_ACCESS_KEY: test
          S3_SECRET_KEY: test
          FIREBASE_CREDENTIALS_PATH: ""
        run: |
          mkdir -p reports
          pytest tests \
            --cov=app \
            --cov-report=xml:reports/coverage.xml \
            --cov-report=term-missing \
            --junitxml=reports/junit.xml

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ matrix.service }}
          path: backend/${{ matrix.service }}/reports/**

  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: always()
    steps:
      - name: Check jobs
        run: |
          if [ "${{ needs.lint.result }}" != "success" ] || [ "${{ needs.test.result }}" != "success" ]; then
            echo "One or more required jobs failed"
            exit 1
          fi
          echo "All checks passed"
