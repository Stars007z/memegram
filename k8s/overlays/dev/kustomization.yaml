apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Dev overlay - inherits everything from base
resources:
  - ../../base

# Dev-specific patches: reduce resource requests for local development
patches:
  # Reduce all Postgres storage to 512Mi for local dev
  - target:
      kind: StatefulSet
      labelSelector: app.kubernetes.io/part-of=memegram
    patch: |-
      - op: replace
        path: /spec/volumeClaimTemplates/0/spec/resources/requests/storage
        value: 512Mi
