      - DATABASE_URL=postgresql+asyncpg://${MEDIA_DB_USER:-memegram}:${MEDIA_DB_PASSWORD:-changeme}@media-postgres:5432/${MEDIA_DB_NAME:-media_db}
      - GRPC_PORT=50055
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION:-eu-central-1}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL:-}
      - PRESIGNED_UPLOAD_TTL=${PRESIGNED_UPLOAD_TTL:-3600}
      - PRESIGNED_DOWNLOAD_TTL=${PRESIGNED_DOWNLOAD_TTL:-900}
      - MAX_UPLOAD_SIZE_BYTES=${MAX_UPLOAD_SIZE_BYTES:-104857600}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - SERVICE_VERSION=${SERVICE_VERSION:-1.0.0}
    ports:
      - "50055:50055"
    depends_on:
      media-postgres:
        condition: service_healthy
    networks:
      - memegram-backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import grpc; channel = grpc.insecure_channel('localhost:50055'); grpc.channel_ready_future(channel).result(timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ─────────────────────────────────────────
  # ITEM STORAGE
  # ─────────────────────────────────────────

  item-storage-postgres:
    image: postgres:15-alpine
    container_name: memegram-item-storage-postgres
    environment:
      POSTGRES_USER: ${ITEM_STORAGE_DB_USER:-memegram}
      POSTGRES_PASSWORD: ${ITEM_STORAGE_DB_PASSWORD:-changeme}
      POSTGRES_DB: ${ITEM_STORAGE_DB_NAME:-item_storage_db}
    ports:
      - "5437:5432"
    volumes:
      - item_storage_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ITEM_STORAGE_DB_USER:-memegram} -d ${ITEM_STORAGE_DB_NAME:-item_storage_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - memegram-backend
    restart: unless-stopped

  item-storage-service:
    build:
      context: ./backend/item-storage-service
      dockerfile: Dockerfile
    container_name: memegram-item-storage-service
    command: >
      sh -c "
        echo 'Waiting for postgres...' &&
        until pg_isready -h item-storage-postgres -U ${ITEM_STORAGE_DB_USER:-memegram} -d ${ITEM_STORAGE_DB_NAME:-item_storage_db}; do sleep 1; done &&
        echo 'Running migrations...' &&
        alembic upgrade head &&
        echo 'Starting gRPC server...' &&
        python -m app.main
      "
    environment:
      - DATABASE_URL=postgresql+asyncpg://${ITEM_STORAGE_DB_USER:-memegram}:${ITEM_STORAGE_DB_PASSWORD:-changeme}@item-storage-postgres:5432/${ITEM_STORAGE_DB_NAME:-item_storage_db}
      - GRPC_PORT=50056
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION:-eu-central-1}
      - S3_BUCKET_NAME=${ITEM_STORAGE_S3_BUCKET}
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL:-}
      - S3_SSE_TYPE=AES256
      - KMS_KEY_ID=
      - PRESIGNED_UPLOAD_TTL=${PRESIGNED_UPLOAD_TTL:-3600}
      - PRESIGNED_DOWNLOAD_TTL=${PRESIGNED_DOWNLOAD_TTL:-900}
      - PENDING_CLEANUP_AFTER_SECONDS=${PENDING_CLEANUP_AFTER_SECONDS:-7200}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - SERVICE_VERSION=${SERVICE_VERSION:-1.0.0}
    ports:
      - "50056:50056"
    depends_on:
      item-storage-postgres:
        condition: service_healthy
    networks:
      - memegram-backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import grpc; channel = grpc.insecure_channel('localhost:50056'); grpc.channel_ready_future(channel).result(timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ─────────────────────────────────────────
  # NOTIFICATIONS
  # ─────────────────────────────────────────

  notifications-postgres:
    image: postgres:15-alpine
    container_name: memegram-notifications-postgres
    environment:
      POSTGRES_USER: ${NOTIFICATIONS_DB_USER:-memegram}
      POSTGRES_PASSWORD: ${NOTIFICATIONS_DB_PASSWORD:-changeme}
      POSTGRES_DB: ${NOTIFICATIONS_DB_NAME:-notifications_db}
    ports:
      - "5438:5432"
    volumes:
      - notifications_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${NOTIFICATIONS_DB_USER:-memegram} -d ${NOTIFICATIONS_DB_NAME:-notifications_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - memegram-backend
    restart: unless-stopped

  notifications-redis:
    image: redis:7-alpine
    container_name: memegram-notifications-redis
    ports:
      - "6382:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3
    networks:
      - memegram-backend
    restart: unless-stopped

  notifications-service:
    build:
      context: ./backend/notifications-service
      dockerfile: Dockerfile
    container_name: memegram-notifications-service
    command: >
      sh -c "
        echo 'Waiting for postgres...' &&
        until pg_isready -h notifications-postgres -U ${NOTIFICATIONS_DB_USER:-memegram} -d ${NOTIFICATIONS_DB_NAME:-notifications_db}; do sleep 1; done &&
        echo 'Running migrations...' &&
        alembic upgrade head &&
        echo 'Starting gRPC server...' &&
        python -m app.main
      "
    environment:
      - DATABASE_URL=postgresql+asyncpg://${NOTIFICATIONS_DB_USER:-memegram}:${NOTIFICATIONS_DB_PASSWORD:-changeme}@notifications-postgres:5432/${NOTIFICATIONS_DB_NAME:-notifications_db}
      - GRPC_PORT=50057
      - REDIS_URL=redis://notifications-redis:6379/0
      - MESSAGING_REDIS_URL=redis://messaging-redis:6379/0
      - STREAM_NAME=notifications:events
      - CONSUMER_GROUP=notifications-cg
      - GOOGLE_APPLICATION_CREDENTIALS=${GOOGLE_APPLICATION_CREDENTIALS:-/app/secrets/firebase.json}
      - FCM_PROJECT_ID=${FCM_PROJECT_ID:-memegram-362c0}
      - APNS_KEY_PATH=${APNS_KEY_PATH:-}
      - APNS_KEY_ID=${APNS_KEY_ID:-}
      - APNS_TEAM_ID=${APNS_TEAM_ID:-}
      - APNS_BUNDLE_ID=${APNS_BUNDLE_ID:-com.memegram.app}
      - APNS_USE_SANDBOX=${APNS_USE_SANDBOX:-true}
      - MESSAGING_GRPC_HOST=messaging-service
      - MESSAGING_GRPC_PORT=50054
      - USER_GRPC_HOST=user-service
      - USER_GRPC_PORT=50052
      - ITEM_STORAGE_GRPC_HOST=item-storage-service
      - ITEM_STORAGE_GRPC_PORT=50056
      - CONTACTS_GRPC_HOST=contacts-service
      - CONTACTS_GRPC_PORT=50053
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - SERVICE_VERSION=${SERVICE_VERSION:-1.0.0}
    volumes:
      - ./memegram-362c0-firebase-adminsdk-fbsvc-87eea9959e.json:/app/secrets/firebase.json:ro
    ports:
      - "50057:50057"
    depends_on:
      notifications-postgres:
        condition: service_healthy
      notifications-redis:
        condition: service_healthy
      messaging-redis:
        condition: service_healthy
      messaging-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
      item-storage-service:
        condition: service_healthy
      contacts-service:
        condition: service_healthy
    networks:
      - memegram-backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import grpc; channel = grpc.insecure_channel('localhost:50057'); grpc.channel_ready_future(channel).result(timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ─────────────────────────────────────────
  # ORCHESTRATOR
  # ─────────────────────────────────────────

  orchestrator:
    build:
      context: ./backend/orchestrator
      dockerfile: Dockerfile
    container_name: memegram-orchestrator
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--loop", "uvloop"]
    environment:
      - APP_NAME=Memegram Orchestrator
      - APP_VERSION=1.0.0
      - HOST=0.0.0.0
      - PORT=8000
      - LOG_LEVEL=INFO
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - AUTH_GRPC_HOST=auth-service
      - AUTH_GRPC_PORT=50051
      - AUTH_GRPC_TIMEOUT=30
      - USER_GRPC_HOST=user-service
      - USER_GRPC_PORT=50052
      - USER_GRPC_TIMEOUT=30
      - CONTACTS_GRPC_HOST=contacts-service
      - CONTACTS_GRPC_PORT=50053
      - CONTACTS_GRPC_TIMEOUT=10
      - MESSAGING_GRPC_HOST=messaging-service
      - MESSAGING_GRPC_PORT=50054
      - MESSAGING_GRPC_TIMEOUT=30
      - MEDIA_GRPC_HOST=media-service
      - MEDIA_GRPC_PORT=50055
      - MEDIA_GRPC_TIMEOUT=10
      - ITEM_STORAGE_GRPC_HOST=item-storage-service
      - ITEM_STORAGE_GRPC_PORT=50056
      - ITEM_STORAGE_GRPC_TIMEOUT=10
      - NOTIFICATIONS_GRPC_HOST=notifications-service
      - NOTIFICATIONS_GRPC_PORT=50057
      - NOTIFICATIONS_GRPC_TIMEOUT=10
      - CORS_ORIGINS=["http://localhost:3000","http://127.0.0.1:3000"]
      - REDIS_URL=redis://auth-redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      auth-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
      contacts-service:
        condition: service_healthy
      messaging-service:
        condition: service_healthy
      media-service:
        condition: service_healthy
      item-storage-service:
        condition: service_healthy
      notifications-service:
        condition: service_healthy
    networks:
      - memegram-backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; exit(0 if httpx.get('http://localhost:8000/health').status_code == 200 else 1)"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s


networks:
  memegram-backend:
    driver: bridge

volumes:
  auth_postgres_data:
  user_postgres_data:
  contacts_postgres_data:
  messaging_postgres_data:
  media_postgres_data:
  item_storage_postgres_data:
  notifications_postgres_data:
