name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Lint (ruff + black + isort)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: |
            requirements-dev.txt

      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.6.9 black==24.10.0 isort==5.13.2

      - name: Ruff
        run: ruff check backend

      - name: Black (check)
        run: black --check backend

      - name: Isort (check)
        run: isort --check-only backend

  test:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-service
          - user-service
          - messaging-service
          - media-service
          - contacts-service
          - notifications-service
          - item-storage-service
          - orchestrator
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: |
            requirements-dev.txt
            backend/${{ matrix.service }}/requirements.txt

      - name: Install dependencies
        working-directory: backend/${{ matrix.service }}
        run: |
          python -m pip install --upgrade pip
          # Не падаем, если какая-то рантайм-зависимость не встанет в CI-окружении
          # (тесты мокают внешние системы и не требуют всех нативных либ).
          pip install -r requirements.txt || true
          pip install -r ../../requirements-dev.txt

      - name: Generate protobuf stubs
        working-directory: backend/${{ matrix.service }}
        # Файлы *_pb2*.py помечены .gitignore у ряда сервисов,
        # поэтому генерим их так же, как это делает Dockerfile сервиса.
        # Шаг no-op, если в сервисе нет каталога proto.
        run: |
          if [ ! -d proto ]; then
            echo "No proto/ directory, skipping"
            exit 0
          fi
          mkdir -p app/generated
          touch app/__init__.py app/generated/__init__.py
          python -m grpc_tools.protoc \
            -I./proto \
            --python_out=./app/generated \
            --grpc_python_out=./app/generated \
            ./proto/*.proto
          # Превращаем абсолютные `import foo_pb2` в относительные `from . import foo_pb2`,
          # чтобы сгенерированные файлы корректно импортировались как пакет app.generated.
          python - <<'PY'
          import pathlib, re
          gen = pathlib.Path("app/generated")
          names = sorted({p.stem.removesuffix("_pb2_grpc").removesuffix("_pb2")
                          for p in gen.glob("*_pb2*.py")})
          for name in names:
              for suffix in ("_pb2.py", "_pb2_grpc.py"):
                  f = gen / f"{name}{suffix}"
                  if not f.exists():
                      continue
                  text = f.read_text()
                  for other in names:
                      text = re.sub(
                          rf'^import {other}_pb2(?P<tail> as |\b)',
                          rf'from . import {other}_pb2\g<tail>',
                          text,
                          flags=re.MULTILINE,
                      )
                  f.write_text(text)
                  print(f"Patched {f}")
          PY

      - name: Run tests with coverage
        working-directory: backend/${{ matrix.service }}
        env:
          PYTHONPATH: ${{ github.workspace }}/backend/${{ matrix.service }}
          # Безопасные значения-заглушки для Settings/конфигов
          ENVIRONMENT: test
          JWT_SECRET: test_secret
          JWT_ALGORITHM: HS256
          DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test
          REDIS_URL: redis://localhost:6379/0
          S3_BUCKET_NAME: test-bucket
          S3_ENDPOINT_URL: http://localhost:9000
          S3_ACCESS_KEY: test
          S3_SECRET_KEY: test
          FIREBASE_CREDENTIALS_PATH: ""
        run: |
          mkdir -p reports
          pytest tests \
            --cov=app \
            --cov-report=xml:reports/coverage.xml \
            --cov-report=term-missing \
            --junitxml=reports/junit.xml

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ matrix.service }}
          path: backend/${{ matrix.service }}/reports/**

  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: always()
    steps:
      - name: Check jobs
        run: |
          if [ "${{ needs.lint.result }}" != "success" ] || [ "${{ needs.test.result }}" != "success" ]; then
            echo "One or more required jobs failed"
            exit 1
          fi
          echo "All checks passed"
